<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="description" content="迷你牧场 · 矿石镇萌版 3D：固定俯视角 Q 版 3D 牧场经营小游戏，纯前端离线可玩。">
<meta name="theme-color" content="#8ec96a">
<title>迷你牧场 · 矿石镇萌版 3D</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%238ec96a'/%3E%3Ctext x='50' y='50' dy='.35em' text-anchor='middle' font-size='64'%3E%F0%9F%90%AE%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/ext.css">
</head>
<body data-season="0" data-weather="0" data-view="pasture">
<div id="app">
  <div class="boot">
    <div class="boot-logo">🐮</div>
    <p>正在唤醒牧场……</p>
    <p class="boot-sub">Q 版 3D 场景加载中，请稍候</p>
  </div>
</div>

<!-- 本地 3D 引擎（离线可用，无需联网） -->
<script src="js/lib/three.min.js"></script>
<!-- 数据层：作物 / 动物 / 工具 / 矿洞 / 节日 / 商店 -->
<script src="js/data.js"></script>
<!-- 逻辑层：状态机、体力与爱心、产物分级、存档 -->
<script src="js/game.js"></script>
<!-- 素材清单：3D 图标 / 动物头部缩略图路径表 -->
<script src="assets/manifest.js"></script>
<!-- 建模层：9 种动物的萌版 3D 建模（与出图素材同源，场景直接复用保证造型一致） -->
<script src="js/models.js"></script>
<!-- 渲染层：固定俯视角萌版 3D 场景（含等距伪 3D 降级） -->
<script src="js/scene.js"></script>
<!-- 界面层：HUD、卡片、网格与交互 -->
<script src="js/ui.js"></script>
<!-- 扩展玩法层：撒娇互动 / 海产图鉴 / 海滩 / 铁镐与矿洞 / 商店兑换 / 天气祭坛 -->
<script src="js/game-ext.js"></script>
<!-- 入口：初始化与主循环 -->
<script src="js/main.js"></script>
</body>
</html>
